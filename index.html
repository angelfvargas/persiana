<style>
:root{--papel:#f6efe2;--tinta:#2a2018;--suave:rgba(246,239,226,.66);--sol:#ffcf8a;
  --serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#120d0a;color:var(--papel);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--sol);outline-offset:4px}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.saludo{position:fixed;left:26px;top:calc(26px + env(safe-area-inset-top));z-index:3;pointer-events:none;transition:opacity 1.6s ease}
.saludo small{display:block;font:500 13px/1 var(--serif);letter-spacing:.22em;text-transform:uppercase;color:var(--suave)}
.saludo{text-shadow:0 1px 18px rgba(0,0,0,.85)}
.saludo h1{margin-top:10px;font:italic 400 clamp(46px,12vw,84px)/.86 var(--serif);letter-spacing:-.02em}
.saludo p{margin-top:16px;max-width:17em;font:italic 400 19px/1.35 var(--serif);color:var(--suave)}
body.abierta .saludo,body.luz .saludo{opacity:0}

.pista{position:fixed;z-index:4;display:flex;align-items:center;gap:10px;font:italic 500 19px/1 var(--serif);color:var(--papel);
  transition:opacity .8s ease;white-space:nowrap}
.pista span{display:inline-block;animation:baja 1.8s ease-in-out infinite}
@keyframes baja{0%,100%{transform:translateY(-3px);opacity:.5}50%{transform:translateY(5px);opacity:1}}
body.jalando .pista,body.abierta .pista{opacity:0;pointer-events:none}

.nota{position:fixed;z-index:5;width:min(84vw,380px);perspective:1400px;opacity:0;transform:translateY(24px) rotate(-1.4deg);
  transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.nota.visible{opacity:1;transform:translateY(0) rotate(-1.4deg);pointer-events:auto}
.hoja{position:relative;background:var(--papel);color:var(--tinta);padding:30px 26px 24px;
  box-shadow:0 1px 1px rgba(0,0,0,.25),0 18px 40px -12px rgba(0,0,0,.6);
  background-image:radial-gradient(120% 90% at 30% 10%,rgba(255,255,255,.55),transparent 60%),repeating-linear-gradient(0deg,transparent 0 31px,rgba(42,32,24,.06) 31px 32px)}
.hoja::before,.hoja::after{content:"";position:absolute;top:-11px;width:78px;height:24px;background:rgba(236,226,200,.72);
  box-shadow:0 1px 2px rgba(0,0,0,.12);backdrop-filter:blur(1px)}
.hoja::before{left:18px;transform:rotate(-5deg)}
.hoja::after{right:18px;transform:rotate(4deg)}
.hoja{min-height:150px}
.carta{max-height:0;overflow:hidden;transition:max-height 1.4s cubic-bezier(.3,.7,.15,1)}
.nota.abierta .carta{max-height:min(60svh,470px);overflow-y:auto;overscroll-behavior:contain}
.carta h2{font:italic 500 30px/1 var(--serif);margin-bottom:14px}
.carta p{font:400 19.5px/1.42 var(--serif);margin-bottom:12px;text-wrap:pretty}
.carta .firma{margin-top:18px;font:italic 500 24px/1 var(--serif);text-align:right}
.tapa{position:absolute;inset:0;z-index:2;transform-origin:50% 0;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.3,.7,.15,1);cursor:pointer}
.tapa .cara,.tapa .dorso{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--papel)}
.tapa .cara{display:grid;place-items:center;text-align:center;color:var(--tinta);
  background-image:radial-gradient(120% 90% at 30% 10%,rgba(255,255,255,.6),transparent 60%);box-shadow:inset 0 -1px 0 rgba(42,32,24,.12)}
.tapa .cara b{display:block;font:italic 500 40px/1 var(--serif)}
.tapa .cara i{display:block;margin-top:12px;font:400 15px/1 var(--serif);letter-spacing:.2em;text-transform:uppercase;opacity:.6;font-style:normal}
.tapa .dorso{transform:rotateX(180deg);background:#eee4d2}
.nota.abierta .tapa{transform:rotateX(178deg);pointer-events:none}
.nota.abierta .tapa .dorso{opacity:0;transition:opacity .3s 1.1s}
.acciones{display:none;margin-top:16px;justify-content:flex-end;opacity:0;transition:opacity 1s .9s}
.nota.abierta .acciones{display:flex}
.nota.abierta .acciones{opacity:1}
.avisar{display:inline-flex;align-items:center;gap:10px;font:italic 500 19px/1 var(--serif);color:var(--tinta);padding:12px 2px 6px;border-bottom:1px solid rgba(42,32,24,.4)}
.avisar:hover{border-bottom-color:var(--tinta)}
.postal{display:none}
body.modo-postal .saludo,body.modo-postal .pista,body.modo-postal .nota{display:none}
body.modo-postal .postal{display:block;position:fixed;right:13%;top:50%;transform:translateY(-50%);z-index:6;text-align:right;text-shadow:0 2px 30px rgba(0,0,0,.9)}
.postal small{display:block;font:500 17px/1 var(--serif);letter-spacing:.28em;text-transform:uppercase;color:var(--suave)}
.postal b{display:block;margin-top:14px;font:italic 400 96px/.88 var(--serif);letter-spacing:-.02em;font-weight:400}
.postal b i{color:var(--sol)}
.sin{position:fixed;inset:0;display:none;place-items:center;padding:30px;text-align:center;font:italic 24px/1.4 var(--serif);background:#120d0a;z-index:10}
@media (prefers-reduced-motion:reduce){.pista span{animation:none}}
</style>
</head>
<body>
<canvas id="lienzo" aria-hidden="true"></canvas>
<header class="saludo"><small id="hora">Buenas tardes</small><h1>mi amor.</h1><p id="sub">Dormiste toda la tarde. Abre la persiana.</p></header>
<button class="pista" id="pista" aria-label="Abrir la persiana">jala la cuerda <span aria-hidden="true">↓</span></button>

<article class="nota" id="nota" aria-live="polite">
  <div class="hoja">
    <div class="carta" id="carta"></div>
    <div class="acciones"><a class="avisar" id="avisar" target="_blank" rel="noopener">Contarle que ya me desperté <span aria-hidden="true">→</span></a></div>
    <button class="tapa" id="tapa" aria-label="Abrir la nota"><div class="cara"><div><b>Para ti</b><i>ábrela</i></div></div><div class="dorso"></div></button>
  </div>
</article>
<div class="postal" aria-hidden="true"><small>Para cuando te despiertes</small><b>Para ti,<br><i>mi amor.</i></b></div>
<div class="sin" id="sin">Mi amor: te extrañé toda la tarde.</div>

<script>
/* ==================================================================
   Para cuando te despiertes.
   La pared del cuarto a media luz y la persiana cerrada. Al jalar la
   cuerda entra la luz de la tarde (o de la luna, si ya es de noche) y en
   la pared aparece la sombra de unas letras de papel pegadas en el vidrio.
   ================================================================== */
const Q=new URLSearchParams(location.search);
const ahora=new Date(), H=Q.has('hora')?+Q.get('hora'):ahora.getHours()+ahora.getMinutes()/60;
const LUNA=H<5.8||H>=18.1;                       // en Cali el sol se pone a eso de las 6
const QUIETO=Q.has('quieto');
const reducido=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- textos ---------- */
const TXT={
  hora:H<12&&H>=5?'Buenos días':(LUNA?'Buenas noches':'Buenas tardes'),
  sub:LUNA?'Dormiste toda la tarde, y ya salió la luna. Abre la persiana.':'Dormiste toda la tarde. Abre la persiana.',
  carta:LUNA?[
    'Mi amor:',
    'Dormiste toda la tarde. El sol te esperó hasta que se cansó y le dejó el turno a la luna. Yo no me cansé: te estuve extrañando todo el tiempo.',
    'No te quise despertar. Mejor te dejé esto, para que lo primero que vieras al abrir los ojos fuera que alguien estuvo pensando en ti toda la tarde.',
    'Ojalá hayas descansado rico.',
    'Te amo mucho.',
  ]:[
    'Mi amor:',
    'Dormiste toda la tarde. El sol estuvo un buen rato entrando por la ventana, buscándote, y yo igual: pendiente de ti, extrañándote.',
    'No te quise despertar. Mejor te dejé esto, para que lo primero que vieras al abrir los ojos fuera que alguien estuvo pensando en ti toda la tarde.',
    'Ojalá hayas descansado rico.',
    'Te amo mucho.',
  ],
  firma:'Ángel',
};
document.getElementById('hora').textContent=TXT.hora;
document.getElementById('sub').textContent=TXT.sub;
document.getElementById('carta').innerHTML=`<h2>${TXT.carta[0]}</h2>`+TXT.carta.slice(1).map(p=>`<p>${p}</p>`).join('')+`<p class="firma">${TXT.firma}</p>`;
document.getElementById('avisar').href='https://wa.me/573217257443';   // abre el chat vacío: ella escribe lo que quiera

/* ---------- color de la luz ---------- */
// tarde: dorado que se va poniendo naranja; noche: plata azulada y más tenue
const tardeTardía=Math.min(1,Math.max(0,(H-14)/4));
const LUZ=LUNA?{a:[172,186,232],b:[118,132,196],fuerza:.5,amb:[12,13,20],grano:.13}
              :{a:[255,Math.round(196-26*tardeTardía),Math.round(118-40*tardeTardía)],b:[246,Math.round(138-26*tardeTardía),Math.round(58-22*tardeTardía)],fuerza:.7,amb:[30,22,18],grano:.16};
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------- lienzos ---------- */
const lienzo=document.getElementById('lienzo');
const ctx=lienzo.getContext('2d');
if(!ctx){document.getElementById('sin').style.display='grid'}
let W=0,Hh=0,DPR=1;
const base=document.createElement('canvas'),grano=document.createElement('canvas'),luz=document.createElement('canvas'),brillo=document.createElement('canvas');
const lx=luz.getContext('2d'),bx=brillo.getContext('2d',{willReadFrequently:true});
let G=null;           // geometría de la ventana proyectada en la pared
let muestra=null;     // la luz en baja resolución, para que el polvo brille solo donde hay sol

function geometria(){
  const vertical=W<Hh;
  // la ventana está detrás de quien mira; el sol la proyecta inclinada sobre la pared
  const U=vertical?[1.06*W,.06*Hh]:[.60*W,.05*Hh];
  const V=vertical?[.30*W,.54*Hh]:[.17*W,.74*Hh];
  // se ubica para que el centro del mensaje (u .5, v .66) caiga donde se lee bien
  const C=vertical?[.5*W,.37*Hh]:[.33*W,.5*Hh];
  const O=[C[0]-.5*U[0]-.66*V[0],C[1]-.5*U[1]-.66*V[1]];
  const Ul=Math.hypot(...U),Vl=Math.hypot(...V);
  const cuerda=vertical?{x:.9*W,y:.56*Hh}:{x:.93*W,y:.42*Hh};
  const nota=vertical?{x:(W-Math.min(W*.84,380))/2,y:null,abajo:Math.max(22,Hh*.045)}:{x:W*.63,y:null,abajo:Math.max(28,Hh*.08)};
  G={vertical,O,U,V,Ul,Vl,cuerda,nota};
}

function ajustar(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; Hh=innerHeight;
  lienzo.width=Math.round(W*DPR); lienzo.height=Math.round(Hh*DPR);
  geometria();
  // pared: pañete pintado, a media luz, con el rodapié abajo
  for(const c of [base,grano]){c.width=lienzo.width;c.height=lienzo.height}
  const b=base.getContext('2d'); b.setTransform(DPR,0,0,DPR,0,0);
  const amb=LUZ.amb, g=b.createLinearGradient(0,0,0,Hh);
  g.addColorStop(0,rgb(amb.map(v=>v*.7)));g.addColorStop(.55,rgb(amb));g.addColorStop(1,rgb(amb.map(v=>v*.8)));
  b.fillStyle=g;b.fillRect(0,0,W,Hh);
  const zr=Hh*(G.vertical?.935:.92);
  b.fillStyle=rgb(amb.map(v=>v*1.25));b.fillRect(0,zr,W,Hh-zr);
  b.fillStyle='rgba(255,240,220,.06)';b.fillRect(0,zr,W,1.5);
  b.fillStyle='rgba(0,0,0,.35)';b.fillRect(0,zr+10,W,2);
  b.fillStyle=rgb(amb.map(v=>v*.55));b.fillRect(0,Hh-Math.max(6,Hh*.012),W,Hh);
  // grano del pañete: se multiplica sobre todo (en la parte con sol es donde más se nota)
  const t=document.createElement('canvas');t.width=t.height=256;const tx=t.getContext('2d'),id=tx.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const v=255-Math.random()*255*LUZ.grano;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  tx.putImageData(id,0,0);
  const t2=document.createElement('canvas');t2.width=t2.height=256;const t2x=t2.getContext('2d');
  t2x.drawImage(t,0,0);t2x.globalCompositeOperation='multiply';t2x.imageSmoothingEnabled=true;
  const gx=grano.getContext('2d');gx.setTransform(1,0,0,1,0,0);gx.fillStyle=gx.createPattern(t2,'repeat');gx.fillRect(0,0,grano.width,grano.height);
  // viñeta suave
  const vg=gx.createRadialGradient(grano.width*.45,grano.height*.42,Math.min(grano.width,grano.height)*.2,grano.width*.5,grano.height*.5,Math.max(grano.width,grano.height)*.8);
  vg.addColorStop(0,'rgba(255,255,255,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');gx.globalCompositeOperation='multiply';gx.fillStyle=vg;gx.fillRect(0,0,grano.width,grano.height);gx.globalCompositeOperation='source-over';
  // la luz se dibuja a un tercio: al agrandarla queda la penumbra suave de una sombra de verdad
  const fl=LUNA?4.2:3.2;
  luz.width=Math.ceil(W/fl);luz.height=Math.ceil(Hh/fl);luz.f=fl;
  brillo.width=Math.ceil(W/14);brillo.height=Math.ceil(Hh/14);
  ubicarNota(); pista(); sucio=true;
}

/* ---------- las letras de papel (cortadas a mano: cada una un poquito torcida) ---------- */
let letras=null;
function prepararLetras(){
  const lineas=[{t:'TE EXTRAÑÉ,',s:1},{t:'MI AMOR',s:.62}];
  const semilla=[.7,-.4,.2,-.9,.5,-.2,.8,-.6,.3,-.8,.1,.6,-.3,.4,-.7,.9,-.1];
  letras={lineas,semilla};
}

/* ---------- estado ---------- */
let p=0, pObjetivo=0;              // 0 = persiana cerrada · 1 = recogida arriba
let tirón=0;                        // cuánto está estirada la cuerda (visual)
let arrastrando=false, yInicio=0, pInicio=0;
let abierta=false, sucio=true, t0=performance.now(), ultimoClic=0;
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

/* ---------- dibujar la luz que entra por la ventana ---------- */
function dibujarLuz(t){
  const {O,U,V,Ul,Vl}=G, f=luz.f;
  lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,luz.width,luz.height);
  lx.setTransform(U[0]/Ul/f,U[1]/Ul/f,V[0]/Vl/f,V[1]/Vl/f,O[0]/f,O[1]/f);
  // el vano de la ventana, más fuerte en el centro
  const g=lx.createLinearGradient(0,0,Ul*.9,Vl);
  g.addColorStop(0,rgb(LUZ.a,LUZ.fuerza));g.addColorStop(.55,rgb(LUZ.a,LUZ.fuerza*.92));g.addColorStop(1,rgb(LUZ.b,LUZ.fuerza*.8));
  lx.fillStyle=g; lx.fillRect(0,0,Ul,Vl);
  lx.globalCompositeOperation='destination-out'; lx.fillStyle='#000';
  // travesaño de la ventana
  lx.fillRect(0,Vl*.255,Ul,Vl*.028);
  lx.fillRect(Ul*.5-Ul*.006,0,Ul*.012,Vl*.255);
  // letras de papel pegadas en el vidrio
  lx.font='100px "Archivo Black", "Arial Black", sans-serif';
  const tam=100*Ul*.74/(lx.measureText(letras.lineas[0].t).width*1.04);
  letras.lineas.forEach((L,li)=>{
    lx.font=`${tam*L.s}px "Archivo Black", "Arial Black", sans-serif`; lx.textBaseline='alphabetic';
    const chars=[...L.t], esp=tam*L.s*.03, anchos=chars.map(c=>lx.measureText(c).width), total=anchos.reduce((a,b)=>a+b,0)+esp*(chars.length-1);
    let x=Ul*.5-total/2; const y=Vl*(li===0?.62:.62)+(li===0?0:tam*.78);
    chars.forEach((c,i)=>{const s=letras.semilla[(i+li*7)%letras.semilla.length];
      lx.save(); lx.translate(x+anchos[i]/2,y+s*tam*.035); lx.rotate(s*.055); lx.fillText(c,-anchos[i]/2,0); lx.restore(); x+=anchos[i]+esp});
  });
  // la matica del alféizar: hojas de corazón que se mecen
  const mece=reducido?0:Math.sin(t*.9)*.05+Math.sin(t*2.3)*.015;
  const hoja=(x,y,s,a)=>{lx.save();lx.translate(x,y);lx.rotate(a);lx.scale(s,s);lx.beginPath();
    lx.moveTo(0,0);lx.bezierCurveTo(-.55,-.15,-.75,-.75,-.32,-.95);lx.bezierCurveTo(-.12,-1.04,0,-.9,0,-.78);
    lx.bezierCurveTo(0,-.9,.12,-1.04,.32,-.95);lx.bezierCurveTo(.75,-.75,.55,-.15,0,0);lx.fill();lx.restore()};
  const tallo=(x0,y0,x1,y1,w)=>{lx.lineWidth=w;lx.strokeStyle='#000';lx.beginPath();lx.moveTo(x0,y0);lx.quadraticCurveTo((x0+x1)/2+w*3,(y0+y1)/2,x1,y1);lx.stroke()};
  const px=Ul*.07,py=Vl*1.02,S=Ul*.058;
  [[-.5,-1.9,1,-.5],[.15,-2.6,.95,.15],[.75,-1.6,.85,.7],[-1.1,-1.1,.75,-1.1],[1.25,-.85,.7,1.05],[-.2,-1.25,.6,-.2]].forEach(([dx,dy,s,a],i)=>{
    const m=mece*(1+i*.25)*(i%2?1:-1)*.8, hx=px+dx*S+m*S*2.2, hy=py+dy*S;
    tallo(px,py,hx,hy,S*.07); hoja(hx,hy,S*s,a*.6+m*2)});
  // la persiana: lamas que se abren y luego se recogen arriba
  const incl=sstep(0,.46,p), sube=sstep(.46,1,p);
  const n=15, abajo=Vl*(1-sube*.86), paquete=Vl*(.012+sube*.1), paso=Vl/n;
  const hueco=.035+.8*incl;
  lx.fillRect(-Ul*.05,-Vl*.02,Ul*1.1,paquete);
  for(let i=0;i<n;i++){const y=paquete+i*paso; if(y>abajo) break;
    lx.fillRect(-Ul*.05,y,Ul*1.1,Math.min(paso*(1-hueco),abajo-y))}
  if(sube<.999) lx.fillRect(-Ul*.05,abajo-Vl*.004,Ul*1.1,Vl*.016);                  // riel de abajo
  // la sombra de la cuerda
  const cu=Ul*.93,lc=Math.max(abajo,paquete)+Vl*.18+tirón*Vl*.25;
  lx.fillRect(cu-Ul*.0018,0,Ul*.0036,lc); lx.beginPath(); lx.ellipse(cu,lc+Vl*.02,Ul*.009,Vl*.026,0,0,7); lx.fill();
  lx.globalCompositeOperation='source-over';
  // muestra pequeña para el polvo y el resplandor
  bx.clearRect(0,0,brillo.width,brillo.height); bx.drawImage(luz,0,0,brillo.width,brillo.height);
  try{muestra=bx.getImageData(0,0,brillo.width,brillo.height).data}catch(e){muestra=null}
}

/* ---------- polvo flotando en el sol ---------- */
const POLVO=Array.from({length:70},(_,i)=>({x:Math.random(),y:Math.random(),z:.4+Math.random()*.9,f:Math.random()*6.28,v:.3+Math.random()*.7}));
function luzEn(x,y){if(!muestra) return 0;const i=(Math.min(brillo.height-1,Math.max(0,Math.floor(y/14)))*brillo.width+Math.min(brillo.width-1,Math.max(0,Math.floor(x/14))))*4;return muestra[i+3]/255}

/* ---------- cuadro ---------- */
function cuadro(t){
  dibujarLuz(t);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.drawImage(base,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.globalCompositeOperation='lighter';
  ctx.drawImage(luz,0,0,lienzo.width,lienzo.height);
  ctx.globalAlpha=.25; ctx.drawImage(brillo,0,0,lienzo.width,lienzo.height); ctx.globalAlpha=1;     // resplandor (sin saturar: si se pasa, el dorado se vuelve verde limón)
  ctx.globalCompositeOperation='multiply'; ctx.drawImage(grano,0,0);
  // polvo: solo brilla donde le da la luz
  ctx.globalCompositeOperation='lighter'; ctx.setTransform(DPR,0,0,DPR,0,0);
  if(p>.15&&!reducido){ for(const d of POLVO){
      d.y-=.00006*d.v; d.x+=.00004*Math.sin(t*.4+d.f); if(d.y<-.02){d.y=1.02;d.x=Math.random()}
      const X=d.x*W,Y=d.y*Hh,l=luzEn(X,Y)*sstep(.15,.7,p); if(l<.05) continue;
      const tw=.55+.45*Math.sin(t*1.7*d.v+d.f);
      ctx.fillStyle=rgb(LUZ.a,l*tw*.9); ctx.beginPath(); ctx.arc(X,Y,d.z*(G.vertical?1.1:1.3),0,7); ctx.fill(); } }
  ctx.globalCompositeOperation='source-over';
  dibujarCuerda(t);
}
function dibujarCuerda(t){
  const {x,y}=G.cuerda, largo=y+tirón*Hh*.28, bal=reducido||arrastrando?0:Math.sin(t*1.3)*3*(1-p*.6);
  const tx=x+bal;
  ctx.strokeStyle='rgba(230,214,190,.55)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(x,-4); ctx.quadraticCurveTo(x+bal*.3,largo*.6,tx,largo); ctx.stroke();
  // borla de madera
  const lz=luzEn(tx,largo+16);
  const g=ctx.createRadialGradient(tx-4,largo+10,1,tx,largo+16,16);
  g.addColorStop(0,`rgba(${200+55*lz},${150+60*lz},${100+40*lz},1)`);g.addColorStop(.6,'rgb(112,74,46)');g.addColorStop(1,'rgb(52,32,20)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(tx,largo+17,9,15,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(20,12,8,.8)'; ctx.fillRect(tx-4,largo-1,8,4);
}

/* ---------- interacción: jalar la cuerda ---------- */
let audio=null;
function clic(){ // un "tic" de lama, muy pasito, y vibración corta en Android
  const ahora=performance.now(); if(ahora-ultimoClic<55) return; ultimoClic=ahora;
  if(navigator.vibrate) try{navigator.vibrate(6)}catch(e){}
  try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    const n=audio.createBufferSource(),b=audio.createBuffer(1,audio.sampleRate*.03,audio.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);
    const f=audio.createBiquadFilter();f.type='bandpass';f.frequency.value=2400+Math.random()*900;f.Q.value=3;
    const g=audio.createGain();g.gain.value=.06;n.buffer=b;n.connect(f).connect(g).connect(audio.destination);n.start();
  }catch(e){}
}
const cercaDeCuerda=(x,y)=>{const {x:cx,y:cy}=G.cuerda,ly=cy+tirón*Hh*.28;return Math.abs(x-cx)<46&&y>cy-120&&y<ly+60};
lienzo.addEventListener('pointerdown',e=>{ if(abierta) return; if(!cercaDeCuerda(e.clientX,e.clientY)) return;
  arrastrando=true; yInicio=e.clientY; pInicio=p; lienzo.setPointerCapture(e.pointerId); document.body.classList.add('jalando'); despertar()});
lienzo.addEventListener('pointermove',e=>{ if(!arrastrando) return;
  const d=Math.max(0,(e.clientY-yInicio)/(Hh*.3)); tirón=Math.min(1,d);
  const nuevo=Math.min(1,pInicio+d*(1-pInicio)); if(Math.floor(nuevo*22)!==Math.floor(p*22)) clic(); p=pObjetivo=Math.max(p,nuevo); despertar()});
const soltar=()=>{ if(!arrastrando) return; arrastrando=false; document.body.classList.remove('jalando');
  if(p>.82||tirón<.04) abrir(); despertar()};
lienzo.addEventListener('pointerup',soltar); lienzo.addEventListener('pointercancel',soltar);
lienzo.style.cursor='default';
lienzo.addEventListener('pointermove',e=>{ if(!arrastrando) lienzo.style.cursor=!abierta&&cercaDeCuerda(e.clientX,e.clientY)?'grab':'default'});
document.getElementById('pista').addEventListener('click',()=>abrir());
function abrir(){ if(pObjetivo>=1&&abierta) return; pObjetivo=1; despertar() }

/* ---------- la nota ---------- */
const nota=document.getElementById('nota');
function ubicarNota(){
  const n=G.nota; nota.style.left=n.x+'px';
  if(n.y!=null){nota.style.top=n.y+'px';nota.style.bottom='auto'} else {nota.style.bottom=`calc(${n.abajo}px + env(safe-area-inset-bottom))`;nota.style.top='auto'}
}
function pista(){ const el=document.getElementById('pista'),{x,y}=G.cuerda;
  el.style.left=Math.max(16,x-196)+'px'; el.style.top=(y+6)+'px'; }
document.getElementById('tapa').addEventListener('click',()=>{nota.classList.add('abierta');try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}});

/* ---------- bucle (descansa cuando no hay nada moviéndose) ---------- */
let corriendo=false, ultimoToque=performance.now(), ultimoCuadro=0;
function despertar(){ ultimoToque=performance.now(); if(!corriendo&&!QUIETO){corriendo=true;requestAnimationFrame(bucle)} }
function bucle(ahora){
  const t=(ahora-t0)/1000;
  // la persiana sigue a la cuerda y, al soltarla, termina de subir sola
  if(!arrastrando){ if(p<pObjetivo){p=Math.min(pObjetivo,p+(reducido?1:.0085+.012*p)); if(Math.floor(p*22)!==Math.floor((p-.01)*22)) clic()} tirón*=.86; }
  document.body.classList.toggle('luz',p>.14);
  if(p>=1&&!abierta){ abierta=true; document.body.classList.add('abierta'); setTimeout(()=>nota.classList.add('visible'),1300); }
  const quieto=performance.now()-ultimoToque>90000;
  if(ahora-ultimoCuadro>=30||arrastrando){ ultimoCuadro=ahora; cuadro(t); }      // 30 cuadros por segundo bastan
  if(quieto&&!arrastrando){ corriendo=false; return }
  requestAnimationFrame(bucle);
}
addEventListener('resize',()=>{ajustar();despertar()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden) despertar()});

/* ---------- arranque ---------- */
prepararLetras(); ajustar();
const listas=document.fonts?Promise.race([document.fonts.load('100px "Archivo Black"'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
listas.then(()=>{
  if(Q.has('postal')){document.body.classList.add('modo-postal');p=pObjetivo=+(Q.get('postal')||.1)}
  if(Q.has('p')){p=pObjetivo=+Q.get('p')} if(Q.has('nota')){p=pObjetivo=1;abierta=true;document.body.classList.add('abierta');nota.classList.add('visible');if(Q.get('nota')==='abierta')nota.classList.add('abierta')}
  cuadro(0); window.__listo=true; despertar();
});
</script>
